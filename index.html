<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fiches de révision</title>
<style>
:root { --bg: #f7f6f2; --surface: #fff; --text: #1e2124; --muted: #5c6166; --border: #dcd9cf; --accent: #1f6f8b; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #15181b; --surface: #1d2125; --text: #e7e9eb; --muted: #a2a9b0; --border: #343a40; --accent: #6cc0dc; }
}
:root[data-theme="dark"] { --bg: #15181b; --surface: #1d2125; --text: #e7e9eb; --muted: #a2a9b0; --border: #343a40; --accent: #6cc0dc; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 720px; margin: 0 auto; padding: 40px 16px 60px; }
.kicker { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
h1 { font-size: clamp(26px, 6vw, 34px); margin: 6px 0 24px; line-height: 1.2; }
a.fiche { display: block; text-decoration: none; color: var(--text); background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 16px 18px; margin: 12px 0; }
a.fiche:hover { border-color: var(--accent); }
a.fiche strong { display: block; font-size: 17px; color: var(--accent); }
a.fiche span { color: var(--muted); font-size: 14.5px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">EPSI · Master 2 cybersécurité</div>
  <h1>Fiches de révision</h1>
  <a class="fiche" href="cartographie-ssi.html">
    <strong>Sécurité d'un SI : cartographie des risques</strong>
    <span>Module SECE914, cours 1 à 4 : risque et DICP, actifs, flux (dont IA), acteurs. Glossaire et quiz.</span>
  </a>
</div>
</body>
</html>
